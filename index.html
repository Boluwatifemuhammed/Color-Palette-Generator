<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color palette generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">

</head>
<body>
    <div class="container">
        <h1>Color Palette Generator</h1>

        <button id="generate-btn">Generate Palette <i class="fas fa-sync"></i> </button>

        <div class="palette-container">
            <div class="color-box">
                <div class="color" style="background-color: #e1f5fe ;"></div>
                <div class="color-info">
                    <span class="hex-value">#e1f5fe</span>
                    <i onclick="copyText(this)" class="fas fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>

            </div>
            <div class="color-box">
                <div class="color" style="background-color: #4e6cff ;"></div>
                <div class="color-info">
                    <span class="hex-value">#4e6cff</span>
                    <i onclick="copyText(this)" class="fas fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>

            </div>
            <div class="color-box">
                <div class="color" style="background-color: #ceffcd ;"></div>
                <div class="color-info">
                    <span class="hex-value">#ceffcd</span>
                    <i onclick="copyText(this)" class="fas fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>

            </div>
            <div class="color-box">
                <div class="color" style="background-color: #fdd3ff ;"></div>
                <div class="color-info">
                    <span class="hex-value">#fdd3ff</span>
                    <i onclick="copyText(this)" class="fas fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>

            </div>
            <div class="color-box">
                <div class="color" style="background-color: #ffd3d3 ;"></div>
                <div class="color-info">
                    <span class="hex-value">#ffd3d3</span>
                    <i onclick="copyText(this)" class="fas fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>

            </div>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>

</html>
